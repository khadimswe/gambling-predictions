[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-predict"
version = "0.1.0"
description = "Predicting soccer match outcomes with team-tier clustering and classification (AI 3642)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khadim Drame" }, { name = "Ryann Ridgeway" }]
dependencies = [
  "certifi",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.17",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
report = ["markdown>=3.6"]

[project.scripts]
soccer = "soccer_predict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["soccer_predict"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["soccer_predict"]
